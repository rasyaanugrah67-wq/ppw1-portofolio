<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 2 - Formulir Pendaftaran</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            background-color: #ffffff;
        }

        .form-title {
            color: #2c3e50;
            font-weight: 700;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 8px;
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            background-color: #ffffff;
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }

        /* Hover effect pada tombol Simpan */
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
        }
    </style>
</head>
<body class="py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
    

                <div class="card p-4 p-md-5">
                    
                    <h3 class="form-title text-center">Formulir Pendaftaran Mahasiswa</h3>
                    <form id="formPendaftaran" action="#" method="POST">
                        
                        <div class="row mb-4">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="namaLengkap" class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control is-valid" id="namaLengkap" value="Rasya Anugrah Dyvanio" required>
                                <div class="valid-feedback">
                                    Format nama terlihat bagus!
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="nim" class="form-label">NIM (Nomor Induk Mahasiswa)</label>
                                <input type="text" class="form-control" id="nim" placeholder="Contoh: 230102030" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="email" class="form-label">Alamat Email</label>
                            <input type="email" class="form-control" id="email" placeholder="contoh@email.com" required>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="prodi" class="form-label">Program Studi</label>
                                <select class="form-select" id="prodi" required>
                                    <option value="" selected disabled>Pilih Program Studi...</option>
                                    <option value="1">Teknologi Rekayasa Perangkat Lunak</option>
                                    <option value="2">Sistem Informasi</option>
                                    <option value="3">Ilmu Komputer</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="semester" class="form-label">Semester</label>
                                <select class="form-select" id="semester" required>
                                    <option value="" selected disabled>Pilih Semester...</option>
                                    <option value="1">Semester 1</option>
                                    <option value="2">Semester 2</option>
                                    <option value="3">Semester 3</option>
                                    <option value="4">Semester 4</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="alamat" class="form-label">Alamat Lengkap</label>
                            <textarea class="form-control" id="alamat" rows="3" placeholder="Masukkan alamat domisili lengkap..." required></textarea>
                        </div>

                        <div class="mb-5">
                            <label for="fotoProfil" class="form-label">Unggah Foto Profil</label>
                            <input class="form-control" type="file" id="fotoProfil" accept="image/*" required>
                            <div class="form-text mt-2 text-muted">Maksimal ukuran file: 2MB (Format: JPG/PNG).</div>
                        </div>

                        <div class="d-flex gap-3">
                            <!-- Button Submit akan memicu validasi atribut 'required' secara otomatis -->
                            <button type="submit" class="btn btn-primary px-5">Simpan Data</button>
                            <button type="reset" class="btn btn-outline-secondary px-4">Reset</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Hanya memanggil Library Bootstrap (Tanpa script buatan sendiri) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

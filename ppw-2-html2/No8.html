<!DOCTYPE html>
<html lang="en">
<head>
    <title>List bersarang dan list definisi</title>
</head>
<body>
    <h3> List bersarang </h3>
    <ul>
        <li>kopi</li>
        <li> teh
            <ul>
                <li> teh hitam </li>
                <li> teh hijau </li>
            </ul>
        </li>
    </ul>
    <br>
    <h3> contoh list definisi : </h3>
    <dl>
        <dt> kopi </dt>
        <dd> minuman panas hitam </dd>
        <dt> susu </dt>
        <dd> minuman dingin putih </dd>
    </dl>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title> Jenis jenis list</title>
</head>
<body>
    <h2>Unordered list</h2>
    <ul>
        <li> List barang 1 </li>
        <li> List barang 2 </li>
        <li> List barang 3 </li>
    </ul>

    <h2> Ordered List </h2>
    <ol>
        <li> List barang 1 </li>
        <li> List barang 2 </li>
        <li> List barang 3 </li>
    </ol>
    
</body>
</html>

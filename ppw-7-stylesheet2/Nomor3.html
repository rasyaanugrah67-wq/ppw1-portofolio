<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktif Komponen - Animasi & Transisi</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    /*  Palet Warna */
:root {
    --primary: #212842;
    --primary-hover: #212842cc; /* Versi transparan untuk hover */
    --accent: #fd8916;
    --bg-color: #ffffff;
    --text-color: #1e293b;
    --white: #ffffff;
    --gray: #e2e8f0;
}

body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    padding: 2rem;
}

/* 3. Elemen Fade In saat Halaman Dibuka */
.fade-in-element {
    animation: fadeIn 1.5s ease-out forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Layouting */
.container { max-width: 800px; text-align: center; }
.section { margin-bottom: 3rem; }
.flex-row { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

/*  button  */
.btn {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    background-color: var(--primary);
    color: var(--white);
    transition: all 0.3s ease;
}

/* Hover: Warna */
.btn-color:hover { background-color: var(--accent); }

/* Hover: Transform */
.btn-transform:hover { transform: scale(1.1); }

/* Hover: Box Shadow */
.btn-shadow:hover { box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4); }

/* 2. Loading Spinner */
.spinner {
    width: 50px;
    height: 50px;
    border: 5px solid var(--gray);
    border-top: 5px solid var(--primary);
    border-radius: 50%;
    margin: 0 auto;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Bonus: Flip Card */
.flip-card {
    width: 200px;
    height: 120px;
    perspective: 1000px;
    margin: 0 auto;
}

.flip-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s;
    transform-style: preserve-3d;
}

.flip-card:hover .flip-card-inner {
    transform: rotateY(180deg);
}

.flip-card-front, .flip-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-weight: bold;
}

.flip-card-front { background-color: var(--primary); color: white; }
.flip-card-back { 
    background-color: var(--accent); 
    color: white; 
    transform: rotateY(180deg); 
}

</style>
<body>

    <div class="container fade-in-element">
        <h1>Komponen Interaktif</h1>

        <!-- Section Tombol -->
        <section class="section">
            <h2>1. Tombol dengan Efek Transition</h2>
            <div class="flex-row">
                <button class="btn btn-color">Ubah Warna</button>
                <button class="btn btn-transform">Angkat (Scale)</button>
                <button class="btn btn-shadow">Efek Shadow</button>
            </div>
        </section>

        <!-- Section Loading -->
        <section class="section">
            <h2>2. Loading Spinner </h2>
            <div class="spinner"></div>
        </section>

        <!-- Bonus: Kartu Berputar -->
        <section class="section">
            <h2> Kartu Flip</h2>
            <div class="flip-card">
                <div class="flip-card-inner">
                    <div class="flip-card-front">COBA HOVER</div>
                    <div class="flip-card-back">SULAP YAYY</div>
                </div>
            </div>
        </section>
    </div>

</body>
</html>

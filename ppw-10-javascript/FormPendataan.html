<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendataan Praktikan PPW1</title>
    <!-- Bootstrap 5 untuk styling tabel -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 50px; background-color: #f8f9fa; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container" id="main-content">
    <h2 class="mb-4">Data Mahasiswa Praktikan</h2>
    <div id="output-area">
        <!-- Tabel akan muncul jika user ngekllik YA -->
    </div>
</div>

<script>
    // Konfirmasi status mahasiswa
    let isStudent = confirm("Apakah Anda mahasiswa PPW1?");

    if (isStudent) {
        // Jika YA:  input data
        let nama = prompt("Masukkan Nama Lengkap:");
        let nim = prompt("Masukkan NIM:");
        let angkatan = prompt("Masukkan Tahun Angkatan (Contoh: 2024):");

        // Konversi input ke Number
        let numNim = parseInt(nim);
        let numAngkatan = parseInt(angkatan);

        
        // Hitung kemungkinan lulus brp tahun (4 tahun)
        let tahunLulus = numAngkatan + 4;
        
        // Cek NIM Genap/Ganjil menggunakan Modulo (%)
        let statusNim = (numNim % 2 === 0) ? "Genap" : "Ganjil";

        // Tampilkan dalam tabel Bootstrap
        let tabelHtml = `
            <table class="table table-striped table-hover">
                <thead class="table-primary">
                    <tr>
                        <th>Kategori</th>
                        <th>Keterangan</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>Nama</td><td>${nama}</td></tr>
                    <tr><td>NIM</td><td>${nim} (${statusNim})</td></tr>
                    <tr><td>Angkatan</td><td>${angkatan}</td></tr>
                    <tr><td>Estimasi Lulus</td><td>Tahun ${tahunLulus}</td></tr>
                </tbody>
            </table>
        `;
        document.getElementById("output-area").innerHTML = tabelHtml;

    } else {
        // Jika TIDAK: tolak
        document.getElementById("main-content").innerHTML = `
            <div class="alert alert-danger text-center">
                <h3 class="display-4">Akses Ditolak! </h3>
                <p>Maaf, lu bukan mahasiswa PPW1. <br> 
                Silakan kembali sebelum kami hack komputermu !!! </p>
                <button class="btn btn-outline-danger mt-3" onclick="location.reload()">Coba Lagi</button>
            </div>
        `;
    }
</script>

</body>
</html>

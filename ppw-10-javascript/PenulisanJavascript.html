<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas JavaScript Output</title>
</head>
<body>

    <h2 id="display-area">Output akan muncul di sini</h2>

    <!-- JavaScript Inline -->
    
    <button onclick="alert('Halo! Ini adalah output dari JavaScript Inline menggunakan Alert.')">
        Klik Saya (Inline)
    </button>

    <!-- JavaScript Embed (Internal) -->
    <script>
        
        document.getElementById("display-area").innerHTML = "Data ini diubah melalui JavaScript Embed!";

       
        console.log("Pesan ini muncul di Console Browser (Metode Embed)");
    </script>

    <!-- JavaScript Eksternal -->
    
    <script src="script.js"></script>

</body>
</html>
